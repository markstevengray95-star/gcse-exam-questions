name: GCSE Science app checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gcse-science-app-checks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm run lint
